<section class="content-section">
  <h2 class="section-title" data-text="title"></h2>
  <p class="section-desc" data-text="description"></p>

  <h3 class="subhead">Fields of Research</h3>
  <div class="chip-row">
    <template data-repeat="topics">
      <span class="chip" data-text="."></span>
    </template>
  </div>

  <h3 class="subhead">Experience</h3>
  <div class="accordion-list">
    <template data-repeat="positions">
      <div class="accordion-item">
        <div class="accordion-header" role="button" tabindex="0">
          <div><span class="accordion-role" data-text="role"></span><span class="accordion-org"> — </span><a class="accordion-org accordion-org-link" data-text="org" data-attr-href="orgUrl" target="_blank" rel="noopener"></a></div>
          <div class="accordion-meta"><span class="accordion-period" data-text="period"></span><span class="accordion-chevron">⌃</span></div>
        </div>
        <div class="accordion-body" style="display:none;">
          <p data-text="details"></p>
        </div>
      </div>
    </template>
  </div>

  <h3 class="subhead">Education</h3>
  <div class="accordion-list">
    <template data-repeat="education">
      <div class="accordion-item">
        <div class="accordion-header" role="button" tabindex="0">
          <div><span class="accordion-role" data-text="role"></span><span class="accordion-org"> — </span><a class="accordion-org accordion-org-link" data-text="org" data-attr-href="orgUrl" target="_blank" rel="noopener"></a></div>
          <div class="accordion-meta"><span class="accordion-period" data-text="period"></span><span class="accordion-chevron">⌃</span></div>
        </div>
        <div class="accordion-body" style="display:none;">
          <p data-text="details"></p>
        </div>
      </div>
    </template>
  </div>

  <h3 class="subhead">Publications</h3>
  <div class="pub-grid">
    <template data-repeat="publications">
      <div class="pub-card">
        <div>
          <h4 class="pub-title" data-text="title"></h4>
          <p class="pub-authors" data-text="authors"></p>
          <p class="pub-summary" data-text="summary"></p>
        </div>
        <div class="pub-footer">
          <span class="pub-venue"><span data-text="venue"></span><span class="pub-date" data-text="date"></span></span>
          <a class="pub-link" data-attr-href="link">Read paper ›</a>
        </div>
      </div>
    </template>
  </div>

  <h3 class="subhead">Other Research Projects</h3>
  <div class="research-project-list">
    <template data-repeat="projects">
      <div class="research-project-card">
        <div>
          <h4 class="research-project-title"><span data-text="title"></span><span class="research-project-date" data-text="date"></span></h4>
          <p class="research-project-desc" data-text="desc"></p>
        </div>
        <span class="status-badge" data-text="status"></span>
      </div>
    </template>
  </div>

  <h3 class="subhead">Conferences Attended</h3>
  <div class="chip-row">
    <template data-repeat="conferences">
      <span class="chip" data-text="."></span>
    </template>
  </div>
</section>
