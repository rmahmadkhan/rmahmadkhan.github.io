<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Muhammad Ahmad Khan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script>
      // Restore the real path after 404.html redirected here (see 404.html for why).
      (function () {
        var params = new URLSearchParams(location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          history.replaceState(null, '', redirect);
        }
      })();

      // Apply the saved/OS theme before first paint to avoid a flash of the wrong theme.
      (function () {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      })();
    </script>
</head>

<body>
    <div class="page" style="min-height: 100vh; display: flex; flex-direction: column;">

        <nav class="topnav">
            <button id="brandBtn" class="brand-btn invisible"></button>
            <div class="nav-right">
                <div id="navLinks" class="nav-links invisible">
                    <button id="overviewBtn" class="jump-link">‹ Home</button>
                    <!-- jump links injected here -->
                </div>
                <div id="themeToggle" class="theme-toggle" role="radiogroup" aria-label="Theme">
                    <button type="button" class="theme-toggle-option" data-theme-choice="light" role="radio" aria-label="Light theme">
                        <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="4.5"></circle>
                            <path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8l1.8-1.8M18 6l1.8-1.8"></path>
                        </svg>
                    </button>
                    <button type="button" class="theme-toggle-option" data-theme-choice="dark" role="radio" aria-label="Dark theme">
                        <svg class="theme-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M20.5 14.7a8.5 8.5 0 1 1-9.2-11.2 8.5 8.5 0 0 0 9.2 11.2Z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </nav>

        <main id="app" class="page-section"></main>

        <footer id="siteFooter" class="site-footer">
            <span class="footer-label">Get in touch</span>
            <div id="socialRowFooter" class="social-row social-row-small"></div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>

</html>
